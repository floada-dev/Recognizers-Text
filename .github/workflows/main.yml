name: main

on:
  # Enable manually triggered workflow runs
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Supersede in-flight runs of the same PR; never cancel a master publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build, Test and Publish
    permissions:
      contents: read   # git checkout only - deploy never needs contents:write
      packages: write  # this is what authorizes `mvn deploy` to GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # PR builds get their own coordinate so the test server can consume them
      # without disturbing the released version.
      - name: Set PR snapshot version
        if: github.event_name == 'pull_request'
        working-directory: Java
        run: |
          set -euo pipefail
          BASE=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1 | tr -d '[:space:]')
          mvn -B versions:set \
            -DnewVersion="${BASE}-PR${{ github.event.pull_request.number }}-SNAPSHOT" \
            -DprocessAllModules=true -DgenerateBackupPoms=false
          # Every pom must be rewritten, including the inter-module dependency
          # versions that hardcode the release rather than ${project.version}.
          # A miss would silently build and test against the published release.
          if grep -rn ">${BASE}<" --include=pom.xml . ; then
            echo "Stale ${BASE} references remain after versions:set"
            exit 1
          fi

      - name: Build and Test with Maven
        working-directory: Java
        run: mvn -B -Dcheckstyle.skip clean install

      - name: Decide whether to publish
        id: check
        working-directory: Java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "Fork PR has no package write access - skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$VERSION" in
            *-SNAPSHOT) echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          URL="https://maven.pkg.github.com/floada-dev/Recognizers-Text/com/microsoft/recognizers/text/recognizers-text-java/${VERSION}/recognizers-text-java-${VERSION}.pom"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" "$URL")
          case "$CODE" in
            404)     echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            200|302) echo "$VERSION already published - skipping publish"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)       echo "Unexpected HTTP $CODE from $URL"; exit 1 ;;
          esac

      - name: Publish Internal Microsoft Recognizers Text
        if: steps.check.outputs.publish == 'true'
        working-directory: Java
        run: mvn -B -pl libraries/recognizers-text -pl libraries/recognizers-text-number -pl libraries/recognizers-text-number-with-unit -pl libraries/recognizers-text-choice -pl libraries/recognizers-text-date-time -pl libraries/recognizers-text-datatypes-timex-expression -pl libraries/recognizers-text-sequence -DskipTests -Dcheckstyle.skip deploy -am
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report published version
        if: steps.check.outputs.publish == 'true'
        run: echo "Published \`${{ steps.check.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
